  <title>Monkey mascot 01 — happy wave</title>
  <desc>Original artwork for the Tribe app (round 3). Palette v3, one 12 u Maroon stroke; rules: STYLE-SHEET.md.
ANCHORS (poses 02-04 copy layer-back/-body/-head + blush verbatim; layer-head and layer-face share rotate(10 256 172)): head c 256,176 rx 130 ry 124, tuft unioned in, crown 52 chin 300; ears r 42 at 120/392,186 pre-tilt (layer-head, before the skull); eyes 214/298,192 rx 21 ry 25 pre-tilt; nostrils y 212; mouth top y 221, 78 wide; blush 188/324,226; shoulders 178,308 / 336,308 r 37; torso 262-414, 208 wide at y 360; belly 256,344 rx 86 ry 64; no badge; sole y 479.
REST ARM (verbatim in 02/03): arm-l 178,308->196,372 r 37, shade-arm-l, mitt-l palm 206,380 r 30.
ORIGINALITY MARKERS, keep in every pose: Coral ear core offset 4 u outward, no Peach middle ring; White secondary glint lower-outer; compact 3-lobe mitts, no finger fan, no palm crease; rounded two-wave tuft, no spikes or notch; tail on the LEFT, open hook; frontal body under a tilted head; no banana, heart bubble, mint tile or badge.
Z-ORDER: layer-shadow sits below arms and head, so shade-head/-cheek live in layer-head and shade-arm-l/-r in layer-arms; only shade-tail/-torso/-belly are in layer-shadow.</desc>

